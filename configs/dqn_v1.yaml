# configs/dqn_v1.yaml
# Reproduce training run with: python train.py --config configs/dqn_v1.yaml

episodes:       500
max_steps:      300
lr:             0.001
gamma:          0.99
epsilon_start:  1.0
epsilon_end:    0.05
epsilon_decay:  0.988
batch_size:     64
target_update:  10
buffer_cap:     10000
save_dir:       models
results_dir:    results
run_id:         dqn_v1_baseline
